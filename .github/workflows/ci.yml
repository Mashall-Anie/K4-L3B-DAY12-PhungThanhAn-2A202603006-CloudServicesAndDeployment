# ═══════════════════════════════════════════════════════════════════
# BONUS — CI/CD với GitHub Actions
#
# Mỗi lần push / pull request: GitHub chạy test + build image trên máy sạch.
# CHỈ khi test + build xanh VÀ đang ở nhánh main (push) mới deploy lên
# Railway bằng token nằm trong GitHub Secrets.
# ═══════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: TEST — chạy checkpoint trên máy sạch ─────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    env:
      # Máy CI không có file .env — truyền giá trị giả qua biến môi trường.
      # Đây chính là lợi ích của 12-Factor: cùng code, khác môi trường
      # chỉ khác biến môi trường.
      AGENT_API_KEY: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Loại test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd
      # (tự tham chiếu badge của chính workflow này) ra khỏi CI
      - name: Run tests
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker" -v

  # ── Job 2: BUILD — build Docker image trên máy sạch ────────────
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build thử để bắt lỗi Dockerfile/.dockerignore trước khi deploy
      - name: Build image (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: day12-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: DEPLOY — chỉ khi test + build xanh, chỉ nhánh main ──
  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Token deploy lấy từ GitHub Secrets (Settings → Secrets → Actions),
      # không bao giờ nằm trong file này
      - name: Deploy
        run: railway up --service agent --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Deploy xong phải kiểm tra service còn sống — PUBLIC_URL đặt trong
      # Settings → Secrets and variables → Actions → Variables
      # Thử lại tới 10 lần x 30s vì deploy trên Railway có thể mất vài phút
      - name: Smoke test sau deploy
        run: |
          for i in $(seq 1 10); do
            echo "lan thu $i..."
            if curl -fsS --max-time 10 "${{ vars.PUBLIC_URL }}/health"; then
              echo " -> service song, OK"
              exit 0
            fi
            sleep 30
          done
          echo " -> /health khong tra loi sau 5 phut"
          exit 1
